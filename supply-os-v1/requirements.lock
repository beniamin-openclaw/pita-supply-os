# Locked dependency versions for supply-os-v1 (H-01 hardening, Track C —
# roadmap item, 2026-08-22). Pinned so `pip install -r requirements.lock`
# reproduces the exact dependency graph CI and a fresh dev clone install,
# instead of `pip install -e ".[dev]"` re-resolving against whatever is
# newest on PyPI that day.
#
# Produced from a clean venv:
#   python3.14 -m venv .venv && source .venv/bin/activate
#   pip install -e ".[dev]"
#   pip freeze --exclude-editable > requirements.lock
#
# Verified: (1) full pytest suite green (522 passed) under that python3.14
# venv; (2) this exact file re-installed cleanly into a separate, clean
# python3.12 venv (CI's actual runtime — see .github/workflows/ci.yml) and
# the full pytest suite + ruff were ALSO green there before this file was
# wired into CI. No 3.14-vs-3.12 mismatch in practice for this dependency
# set — every pin resolved a compatible wheel on both.
#
# To regenerate: repeat the three commands above from a clean venv (any
# Python 3.10+ the project supports), review the diff, and re-verify against
# CI's python-version (.github/workflows/ci.yml, `setup-python`) before
# committing — a future dependency may not be as version-agnostic as this
# set turned out to be.

